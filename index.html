<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Cauldron Phone Pick</title>
<style>
:root{
  --bg:#0a0710;
  --panel:#170d20;
  --purple:#7b2cff;
  --orange:#ff7818;
  --acid:#a6ff3c;
  --text:#fff3dc;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 0,#35134b 0,#13091c 35%,#07050b 100%);
  overflow-x:hidden;
}

/* MORE WEBS IN BACKGROUND */
.web{
  position:fixed;
  width:190px;
  height:190px;
  opacity:.24;
  pointer-events:none;
  z-index:0;
  background:
    repeating-radial-gradient(circle at top left,
      transparent 0 22px,
      #fff 23px 24px,
      transparent 25px 44px),
    linear-gradient(45deg,transparent 49%,#fff 50%,transparent 51%),
    linear-gradient(22deg,transparent 49%,#fff 50%,transparent 51%),
    linear-gradient(67deg,transparent 49%,#fff 50%,transparent 51%);
}

.web.tl{top:0;left:0}
.web.tr{top:0;right:0;transform:scaleX(-1)}
.web.bl{bottom:0;left:0;transform:scaleY(-1)}
.web.br{bottom:0;right:0;transform:scale(-1)}
.web.mid-left{top:38%;left:-65px;transform:rotate(12deg)}
.web.mid-right{top:55%;right:-65px;transform:scaleX(-1) rotate(12deg)}

.app{
  min-height:100vh;
  padding:32px 14px 44px;
  position:relative;
  z-index:1;
}

.app:after{
  content:"🕷️";
  position:fixed;
  right:22px;
  top:82px;
  font-size:28px;
  animation:spider 2.4s ease-in-out infinite alternate;
  z-index:3;
}

.app:before{
  content:"🕸️";
  position:fixed;
  left:14px;
  top:32%;
  font-size:48px;
  opacity:.26;
  z-index:0;
}

@keyframes spider{
  to{transform:translateY(26px)}
}

.header{
  text-align:center;
  max-width:520px;
  margin:auto;
}

.header h1{
  font-family:Georgia,serif;
  font-size:42px;
  line-height:.95;
  margin:14px 0 10px;
  text-shadow:0 0 28px #892dff88;
}

.stage,.formbox{
  width:min(94vw,520px);
  margin:22px auto 0;
  background:#140c1dcc;
  border:1px solid #ffffff17;
  border-radius:28px;
  box-shadow:0 26px 70px #0009;
  padding:22px 16px;
  backdrop-filter:blur(12px);
  position:relative;
  z-index:2;
}

.cauldrons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  align-items:end;
  min-height:205px;
}

.cwrap{
  position:relative;
  transition:.2s;
}

.steam{
  position:absolute;
  left:50%;
  top:2px;
  transform:translateX(-50%);
  width:70px;
  height:60px;
}

.steam i{
  position:absolute;
  bottom:0;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#a6ff3c88;
  box-shadow:0 0 17px #a6ff3c;
  animation:bubble 2s linear infinite;
}

.steam i:nth-child(1){left:12px}
.steam i:nth-child(2){left:34px;animation-delay:.6s}
.steam i:nth-child(3){left:53px;animation-delay:1.2s}

@keyframes bubble{
  0%{transform:translateY(18px) scale(.6);opacity:0}
  30%{opacity:1}
  100%{transform:translateY(-38px) scale(1.4);opacity:0}
}

.kettle{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  filter:drop-shadow(0 14px 16px #000a) drop-shadow(0 0 14px #842eff55);
}

.lab{
  text-align:center;
  color:#756282;
  font-size:10px;
  letter-spacing:.14em;
}

.shuffle .cwrap:nth-child(1){animation:a 1.15s}
.shuffle .cwrap:nth-child(2){animation:b 1.15s}
.shuffle .cwrap:nth-child(3){animation:c 1.15s}

@keyframes a{
  35%{transform:translateX(105%) translateY(-15px)}
  70%{transform:translateX(205%)}
}
@keyframes b{
  35%{transform:translateX(-105%)}
  70%{transform:translateX(105%) translateY(-18px)}
}
@keyframes c{
  35%{transform:translateX(-205%) translateY(-8px)}
  70%{transform:translateX(-105%)}
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.go{
  display:block;
  width:min(250px,82%);
  margin:18px auto 0;
  padding:15px;
  border-radius:15px;
  font-weight:900;
  color:#160b1d;
  background:linear-gradient(#bfff65,#84ef1d);
  box-shadow:0 6px 0 #456c16;
}

.go:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #456c16;
}

.choices{
  display:none;
  margin-top:22px;
}

.choices.show{
  display:block;
}

.choicegrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.pick{
  padding:14px 4px;
  border-radius:13px;
  background:linear-gradient(#923fff,#5b18b6);
  color:#fff;
  font-weight:900;
  box-shadow:0 4px 0 #351066;
}

.reveal{
  display:none;
  text-align:center;
}

.reveal.show{
  display:block;
  animation:pop .4s ease;
}

@keyframes pop{
  from{opacity:0;transform:scale(.78)}
  to{opacity:1;transform:scale(1)}
}

.phone{
  width:min(220px,62vw);
  max-height:320px;
  object-fit:contain;
  filter:drop-shadow(0 20px 22px #000b);
  display:block;
  margin:10px auto;
}

.continue{
  padding:13px 24px;
  border-radius:14px;
  background:linear-gradient(#ff9a3d,#f66009);
  color:#fff;
  font-weight:900;
  box-shadow:0 5px 0 #893304;
}

.formbox{
  display:none;
}

.formbox.show{
  display:block;
  animation:pop .4s ease;
}

.formbox h2{
  margin:0 0 16px;
  font-size:29px;
  font-family:Georgia,serif;
  text-align:center;
}

.field{
  margin:0 0 12px;
}

.field input{
  width:100%;
  height:50px;
  border:1px solid #ffffff1f;
  background:#0c0711;
  color:#fff;
  border-radius:13px;
  padding:0 14px;
  font-size:15px;
  outline:none;
}

.field input:focus{
  border-color:#9a4bff;
  box-shadow:0 0 0 3px #9a4bff20;
}

.submit{
  width:100%;
  padding:13px;
  border-radius:13px;
  font-weight:900;
  background:linear-gradient(#ff8c2e,#ec5200);
  color:white;
  box-shadow:0 5px 0 #7d2b00;
}

.success{
  display:none;
  text-align:center;
  padding:25px 6px;
}

.success.show{
  display:block;
  animation:pop .4s ease;
}

.success .emoji{
  font-size:58px;
}

/* HALLOWEEN CONFETTI */
.confetti-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9999;
}

.confetti-piece{
  position:absolute;
  top:-50px;
  font-size:26px;
  will-change:transform,opacity;
  animation:confettiFall linear forwards;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
}

@keyframes confettiFall{
  0%{
    transform:translate3d(0,-40px,0) rotate(0deg) scale(.8);
    opacity:0;
  }
  8%{opacity:1}
  100%{
    transform:translate3d(var(--drift),110vh,0) rotate(var(--spin)) scale(1.1);
    opacity:.95;
  }
}

.burst-piece{
  position:fixed;
  left:50%;
  top:48%;
  font-size:30px;
  pointer-events:none;
  z-index:10000;
  animation:burst 1.25s ease-out forwards;
}

@keyframes burst{
  from{
    transform:translate(-50%,-50%) scale(.3) rotate(0deg);
    opacity:1;
  }
  to{
    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1.25)
      rotate(var(--r));
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="web tl"></div>
<div class="web tr"></div>
<div class="web bl"></div>
<div class="web br"></div>
<div class="web mid-left"></div>
<div class="web mid-right"></div>

<div class="app">

  <div class="header">
    <h1>HALLOWEEN<br>PHONE PACKAGES</h1>
  </div>

  <section class="stage">

    <div id="game">

      <div class="cauldrons" id="cauldrons">

        <div class="cwrap">
          <div class="steam"><i></i><i></i><i></i></div>
          <img class="kettle" src="kettle.png" alt="Boiling witch kettle">
          <div class="lab">LEFT</div>
        </div>

        <div class="cwrap">
          <div class="steam"><i></i><i></i><i></i></div>
          <img class="kettle" src="kettle.png" alt="Boiling witch kettle">
          <div class="lab">MID</div>
        </div>

        <div class="cwrap">
          <div class="steam"><i></i><i></i><i></i></div>
          <img class="kettle" src="kettle.png" alt="Boiling witch kettle">
          <div class="lab">RIGHT</div>
        </div>

      </div>

      <button class="go" id="go">GO</button>

      <div class="choices" id="choices">
        <div class="choicegrid">
          <button class="pick" data-pick="LEFT">LEFT</button>
          <button class="pick" data-pick="MID">MID</button>
          <button class="pick" data-pick="RIGHT">RIGHT</button>
        </div>
      </div>

    </div>

    <div class="reveal" id="reveal">
      <img class="phone" src="phone.png" alt="Mystery phone">
      <button class="continue" id="continue">GO</button>
    </div>

  </section>

  <section class="formbox" id="formbox">

    <div id="formcontent">
      <h2>Just a little more!</h2>

      <form id="form">

        <div class="field">
          <input id="name" placeholder="Name" autocomplete="name">
        </div>

        <div class="field">
          <input id="number" placeholder="Number" autocomplete="tel">
        </div>

        <button class="submit" type="submit">CONFIRM</button>

      </form>
    </div>

    <div class="success" id="success">
      <div class="emoji">🎃</div>
    </div>

  </section>

</div>

<div class="confetti-layer" id="confettiLayer"></div>

<script>

const PRESET = {
  name: "Alex Morgan",
  number: "+1 555 012 3456"
};

const $ = id => document.getElementById(id);

const go = $("go");
const row = $("cauldrons");
const choices = $("choices");
const game = $("game");
const reveal = $("reveal");
const formbox = $("formbox");
const nameInput = $("name");
const numberInput = $("number");
const confettiLayer = $("confettiLayer");

const halloweenIcons = [
  "🕸️","🕷️","💀","☠️","🦇","🎃","👻","✨","🕸️","💀","🕷️","☠️"
];

function createFallingPiece(){
  const el = document.createElement("div");
  el.className = "confetti-piece";
  el.textContent = halloweenIcons[Math.floor(Math.random()*halloweenIcons.length)];

  el.style.left = Math.random()*100 + "vw";
  el.style.fontSize = (18 + Math.random()*24) + "px";
  el.style.animationDuration = (1.8 + Math.random()*1.8) + "s";
  el.style.setProperty("--drift",(Math.random()*180-90) + "px");
  el.style.setProperty("--spin",(Math.random()*900-450) + "deg");

  confettiLayer.appendChild(el);

  setTimeout(()=>el.remove(),4000);
}

function fallingBurst(amount=34){
  for(let i=0;i<amount;i++){
    setTimeout(createFallingPiece,i*25);
  }
}

function centerBurst(amount=22){
  for(let i=0;i<amount;i++){
    const el = document.createElement("div");
    el.className = "burst-piece";
    el.textContent = halloweenIcons[Math.floor(Math.random()*halloweenIcons.length)];

    const angle = Math.random()*Math.PI*2;
    const distance = 90 + Math.random()*250;

    el.style.setProperty("--x", Math.cos(angle)*distance + "px");
    el.style.setProperty("--y", Math.sin(angle)*distance + "px");
    el.style.setProperty("--r", (Math.random()*700-350) + "deg");

    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1400);
  }
}

function spookyCelebration(){
  centerBurst(24);
  fallingBurst(35);

  setTimeout(()=>{
    centerBurst(18);
    fallingBurst(26);
  },450);

  setTimeout(()=>{
    centerBurst(14);
    fallingBurst(22);
  },900);
}

go.onclick = () => {
  go.disabled = true;
  go.textContent = "MIXING THE SPELL…";

  row.classList.add("shuffle");

  setTimeout(()=>{
    row.classList.remove("shuffle");
    go.style.display = "none";
    choices.classList.add("show");
  },1250);
};

document.querySelectorAll(".pick").forEach(btn=>{
  btn.onclick = () => {

    game.style.display = "none";
    reveal.classList.add("show");

    /* CONFETTI WHEN THE KETTLE RESULT OPENS */
    spookyCelebration();
  };
});

$("continue").onclick = () => {
  formbox.classList.add("show");
  formbox.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
};

nameInput.addEventListener(
  "pointerdown",
  ()=>{
    if(!nameInput.value){
      nameInput.value = PRESET.name;
    }
  },
  {once:true}
);

numberInput.addEventListener(
  "pointerdown",
  ()=>{
    if(!numberInput.value){
      numberInput.value = PRESET.number;
    }
  },
  {once:true}
);

$("form").onsubmit = e => {

  e.preventDefault();

  $("formcontent").style.display = "none";
  $("success").classList.add("show");

  /* CONFETTI AFTER FORM COMPLETION */
  spookyCelebration();

  /* EXTRA FINAL HALLOWEEN BURSTS */
  setTimeout(()=>spookyCelebration(),1100);
  setTimeout(()=>fallingBurst(45),2100);
};

</script>

</body>
</html>
